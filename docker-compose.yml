services:
  # --------------------------------------------------
  # Zookeeper — coordinates the Kafka broker
  # --------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: stocks-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # --------------------------------------------------
  # Kafka
  # --------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: stocks-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # --------------------------------------------------
  # Kafdrop — Kafka web UI
  # --------------------------------------------------
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: stocks-kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092

  # --------------------------------------------------
  # RustFS — S3-compatible object storage (replaces MinIO)
  # --------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: stocks-rustfs
    ports:
      - "9001:9001" # Console UI
      - "9002:9000" # S3 API
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    command: ["--address", ":9000", "--console-enable", "/data"]

  # --------------------------------------------------
  # Airflow PostgreSQL metadata database
  # --------------------------------------------------
  postgres:
    image: postgres:15
    container_name: stocks-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --------------------------------------------------
  # Airflow initialization
  # --------------------------------------------------
  airflow-init:
    build:
      context: ./airflow
    container_name: stocks-airflow-init
    depends_on:
      - postgres
      - rustfs
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH}
    volumes:
      - ./airflow/dags:/opt/airflow/dags

      - ./airflow/logs:/opt/airflow/logs
      # if you want the logs to live inside a Docker-Managed volume instead of on local as a bind mount (above)
      # - airflow_logs:/opt/airflow/logs

      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/keys:/opt/airflow/keys:ro
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USER}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Data
      --lastname Engineer
      --role Admin
      --email admin@example.com
      || true
      "
    user: "${AIRFLOW_UID:-50000}:0"

  # --------------------------------------------------
  # Airflow webserver
  # --------------------------------------------------
  airflow-webserver:
    build:
      context: ./airflow
    container_name: stocks-airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH}
    volumes:
      - ./airflow/dags:/opt/airflow/dags

      # if you want the logs to live inside a Docker-Managed volume instead of on local as a bind mount (above)
      - ./airflow/logs:/opt/airflow/logs

      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/keys:/opt/airflow/keys:ro
    ports:
      - "8080:8080"
    command: webserver
    user: "${AIRFLOW_UID:-50000}:0"

  # --------------------------------------------------
  # Airflow scheduler
  # --------------------------------------------------
  airflow-scheduler:
    build:
      context: ./airflow
    container_name: stocks-airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH}
    volumes:
      - ./airflow/dags:/opt/airflow/dags

      # if you want the logs to live inside a Docker-Managed volume instead of on local as a bind mount (above)
      - ./airflow/logs:/opt/airflow/logs

      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/keys:/opt/airflow/keys:ro
    command: scheduler
    user: "${AIRFLOW_UID:-50000}:0"

volumes:
  postgres_data:
  rustfs_data:
  # not needed if using a bind mount from local machine instead of having logs live in the Docker volume
  # airflow_logs:
